name: Apply universal human runtime migration

on:
  push:
    branches: [feat/shareable-interaction-ledger]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[universal-runtime-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/shareable-interaction-ledger
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply source migration
        run: node scripts/apply-universal-human-runtime.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/schema/interaction.ts src/state/pageState.ts src/rendering/renderPage.ts src/universal.css scripts/enforce-one-runtime.ts
          git commit -m "Complete universal human interaction state [universal-runtime-applied]"
          git push origin HEAD:feat/shareable-interaction-ledger
