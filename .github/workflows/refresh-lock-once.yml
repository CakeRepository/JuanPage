name: Refresh lockfile once

on:
  push:
    branches:
      - feat/release-grade-conformance

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/release-grade-conformance
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply compatible audit fixes to the lockfile
        run: npm audit fix --package-lock-only
      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already contains all compatible audit fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update audited dependency lockfile"
          git push origin HEAD:feat/release-grade-conformance
