name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without publishing
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify release, package, consumer, and benchmark
        run: npm run release:dry-run
      - name: Build publishable tarball
        id: pack
        shell: bash
        run: |
          npm pack --ignore-scripts --json > release-pack.json
          TARBALL=$(node -e "const p=require('./release-pack.json'); process.stdout.write(p[0].filename)")
          test -n "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - name: Generate software bill of materials
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Generate release checksums
        run: sha256sum "${{ steps.pack.outputs.tarball }}" sbom.cdx.json > checksums.txt
      - name: Publish package with provenance
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: .github/RELEASE_TEMPLATE.md
          files: |
            ${{ steps.pack.outputs.tarball }}
            sbom.cdx.json
            checksums.txt
            benchmark/results/latest.json
            benchmark/results/latest.md
