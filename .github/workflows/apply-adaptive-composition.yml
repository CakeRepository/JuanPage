name: Apply adaptive composition

on:
  push:
    branches:
      - feat/unbounded-adaptive-composition

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ hashFiles('.github/adaptive-composition.tar.gz.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared source changes
        run: |
          base64 --decode .github/adaptive-composition.tar.gz.b64 | tar -xzf -
      - name: Install dependencies
        run: npm ci
      - name: Verify one-runtime invariant
        run: npm run check:one-runtime
      - name: Run tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit verified source
        run: |
          rm .github/adaptive-composition.tar.gz.b64
          rm .github/workflows/apply-adaptive-composition.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire adaptive composition into the universal renderer"
          git push
