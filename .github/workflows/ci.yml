name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Architecture invariant
        run: npm run check:one-runtime
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Conformance tests
        run: npm run test:conformance
      - name: Application and SDK build
        run: npm run build
      - name: Public API compatibility
        run: npm run check:public-api
      - name: npm package dry run
        run: npm run package:dry-run
      - name: Benchmark smoke test
        run: npm run benchmark:smoke
