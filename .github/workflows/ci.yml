name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Full dependency audit
        run: npm audit --audit-level=high
      - name: Release identity
        run: npm run check:release-version
      - name: Architecture invariant
        run: npm run check:one-runtime
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Conformance and deterministic fuzz tests
        run: npm run test:conformance
      - name: Browser interaction journeys
        run: npm run test:e2e
      - name: Application and SDK build
        run: npm run build
      - name: Public API compatibility
        run: npm run check:public-api
      - name: Clean-room packed SDK consumer
        run: npm run test:consumer
      - name: npm package dry run
        run: npm run package:dry-run
      - name: Benchmark and performance budget
        run: npm run benchmark:budget
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Upload conformance evidence
        uses: actions/upload-artifact@v7
        with:
          name: juanpager-conformance-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            benchmark/results/latest.json
            benchmark/results/latest.md
            sbom.cdx.json
            playwright-report/
            test-results/
